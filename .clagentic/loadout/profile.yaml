# DRAFT repo profile, inferred from the file tree. Review every line before committing.
# Observations:
#   - root packaging manifest: package.json
#   - hidden directory .crew/ looks like tool state, not product
class: released-tool
paths:
  ".crew/**": {class: internal}
test:
  prepare: [npm, ci]
  full: [node, --test, --test-timeout=300000, --test-reporter=junit, "--test-reporter-destination={junit}", "test/*.test.js"]
  files: [node, --test, --test-timeout=300000, --test-reporter=junit, "--test-reporter-destination={junit}"]
