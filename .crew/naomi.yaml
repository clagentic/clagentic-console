# .crew/naomi.yaml — NAOMI per-project configuration for clagentic-console
#
# Schema: schemas/crew-config.schema.json (schema_version: 1)
# Scaffolded by: amos lr-a68f

schema_version: 1

# merge_allowed: true — clagentic-console is an active development repo with
# CI (pr-checks.yml) and a local test suite. NAOMI may merge autonomously
# once all gates below pass.
merge_allowed: true

merge_requirements:
  tests_pass: true
  # ci_pass: true — pr-checks.yml runs syntax and import-resolution checks on
  # every PR via GitHub Actions. CI is real and required before any merge.
  ci_pass: true

# reviewer_required: true — PEACHES must post a clean review before NAOMI
# may merge. This is the safe default for a user-facing product.
reviewer_required: true

focus:
  - "Clagentic: Console (capital C, colon, space, capital C) is the product name — never bare 'clagentic' in merge notes or gate comments"
  - "CI gate is pr-checks.yml on GitHub Actions (syntax + import resolution); require green before merging"

avoid:
  - "Do not merge PRs that touch bin/cli.js or lib/ without green CI"
  - "Do not merge if PEACHES review is absent or blocking"

# post_merge_steps — REMOVED here (lr-0d45). This key was DEAD CONFIG: NAOMI's
# live merge path for this repo is loadout-merge (crew_merge.py's GitHub path
# is hard-refused, EXIT_GITHUB_PATH_DEPRECATED, operator ruling lr-d9729d,
# 2026-07-13), and loadout-merge reads post_merge_steps EXCLUSIVELY from
# `<repo_root>/.clagentic/loadout/config.yaml`'s `merge:` section
# (post_merge_config.load_post_merge_steps in clagentic-loadout) — it never
# reads this file. Leaving a post_merge_steps key here risked being read as a
# second, stale source of truth for a step nothing actually executes from this
# location. The equivalent (and now hardened — on_failure: fail, plus a new
# build-SHA verification step) post_merge_steps now lives at
# .clagentic/loadout/config.yaml's merge.post_merge_steps. See that file's own
# header comment for the full migration rationale.
