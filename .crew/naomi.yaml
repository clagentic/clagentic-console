# .crew/naomi.yaml — NAOMI per-project configuration for clagentic-console
#
# Schema: schemas/crew-config.schema.json (schema_version: 1)
# Scaffolded by: amos lr-a68f

schema_version: 1

# merge_allowed: true — clagentic-console is an active development repo with
# CI (pr-checks.yml) and a local test suite. NAOMI may merge autonomously
# once all gates below pass.
merge_allowed: true

merge_requirements:
  tests_pass: true
  # ci_pass: true — pr-checks.yml runs syntax and import-resolution checks on
  # every PR via GitHub Actions. CI is real and required before any merge.
  ci_pass: true

# reviewer_required: true — PEACHES must post a clean review before NAOMI
# may merge. This is the safe default for a user-facing product.
reviewer_required: true

focus:
  - "Clagentic: Console (capital C, colon, space, capital C) is the product name — never bare 'clagentic' in merge notes or gate comments"
  - "CI gate is pr-checks.yml on GitHub Actions (syntax + import resolution); require green before merging"

avoid:
  - "Do not merge PRs that touch bin/cli.js or lib/ without green CI"
  - "Do not merge if PEACHES review is absent or blocking"

# post_merge_steps — ordered list of steps NAOMI runs after a successful merge.
#
# install:local-test was added in PR #289 (main). It packs the repo into a
# tarball, installs it globally with `npm install -g`, and removes the tarball.
# This is a developer/test-tier operation, not a production deploy. It is
# intentionally on_failure: warn — a failed local test-install must not roll
# back or block a merge that already cleared all CI and review gates. The
# install touches the operator's global npm environment, which may vary; a
# failure here is surfaced for awareness but is not a correctness signal about
# the merged code itself.
post_merge_steps:
  - cmd: "npm run install:local-test"
    description: "Install latest build globally for developer test (npm pack + npm install -g). Test-tier only — not production."
    # on_failure: warn — local test-install failure must not block or roll back
    # a merge that already passed tests, CI, and PEACHES. Environment variance
    # (global npm state, disk space, platform) should not gate code quality.
    on_failure: warn
