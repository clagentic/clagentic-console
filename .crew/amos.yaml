scope:
  allowed_paths:
    - bin/**
    - lib/**
    - .crew/**
    - test/**
    - deploy/**
    - scripts/**
    - package.json

branch_conventions:
  feat: "feat/lr-{task_id}-{slug}"
  fix: "fix/lr-{task_id}-{slug}"
  chore: "chore/lr-{task_id}-{slug}"

pr_workflow:
  # MANDATORY — do NOT use gh pr create or curl to open PRs.
  # The only supported path for push + PR on this repo is ship.py:
  #
  #   python3 /workspace/local-scripts/ship/ship.py clagentic-console --title '...'
  #
  # ship.py handles push, PR creation, merge, and post-merge cleanup atomically.
  # If clagentic-console is missing from ship.py's config, add it to:
  #   /workspace/local-scripts/ship/config.json
  # then run ship.py — do not bypass it.

brand_rules:
  # MANDATORY — violating these is a hard error, not a style note.
  #
  # Product name (user-facing text, help strings, log output): "Clagentic: Console"
  # CLI binary / command:                                       clagentic-console
  # npm package:                                                @clagentic/console
  # NEVER use bare "clagentic" as a product name or command.
  #
  # Technical identifiers that ARE correct:
  #   CLAGENTIC_*   (env var prefix)
  #   ~/.clagentic/ (home dir)
  #   clagentic-*   (hyphenated service names: clagentic-relay, clagentic-router, etc.)
  #
  # Before committing any change to bin/cli.js or lib/**/*.js, grep for violations:
  #   grep -n '"clagentic[^-_/@]' bin/cli.js lib/**/*.js
