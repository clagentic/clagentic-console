# .crew/peaches.yaml — PEACHES per-project configuration for clagentic-console
#
# Schema: schemas/crew-config.schema.json (reviewer block, lr-840a)
# Scaffolded by: amos lr-a68f

schema_version: 1

reviewer:
  rules:
    # Enforce product name in user-facing strings. Bare "clagentic" (without a
    # hyphen, slash, or valid suffix) in output strings or help text is a brand
    # violation per CLAUDE.md §BRAND RULES.
    - id: clagentic-console.brand-product-name
      severity: blocking
      description: >-
        User-facing strings must use "Clagentic: Console" (product name) or
        "clagentic-console" (CLI command), never bare "clagentic". Applies to
        bin/cli.js usage/help text and any lib/**/*.js string presented to users.
      pattern: "(?<![/@-])\\bclagentic\\b(?![-_/:@]|\\[bot\\])"
      applies_to:
        - "bin/**/*.js"
        - "lib/**/*.js"

    # LLM calls in this repo must use the claude CLI, not the Anthropic SDK
    # directly (workspace CLAUDE.md rule 17; echoed in repo CLAUDE.md).
    # New require('anthropic') or import from '@anthropic-ai/sdk' in app code
    # (outside of existing wired usage in lib/) is a violation.
    - id: clagentic-console.no-new-sdk-direct-require
      severity: blocking
      description: >-
        New code must not add direct Anthropic SDK (anthropic / @anthropic-ai/sdk)
        require() or import statements in app code. Use the claude CLI instead
        (workspace CLAUDE.md rule 17). Flag any new require/import not present
        in main before this PR.
      applies_to:
        - "bin/**/*.js"
        - "lib/**/*.js"

    # The daemon socket path is ~/.clagentic/daemon.sock; hardcoding any
    # absolute path or hostname makes the package non-portable.
    - id: clagentic-console.no-hardcoded-paths
      severity: blocking
      description: >-
        No absolute paths, machine names, or personal identifiers in committed
        code. Config and paths must be resolved at runtime from env vars or
        user home directory. (workspace CLAUDE.md rule 10)
      pattern: "/home/[a-zA-Z0-9_]+/"
      applies_to:
        - "bin/**/*.js"
        - "lib/**/*.js"
        - "scripts/**/*.js"

    # Client-side ES modules live in lib/public/ and must not import from
    # server-side CommonJS modules. The CI check (check-client-imports.js)
    # enforces resolution but PEACHES can catch intent-level issues in review.
    - id: clagentic-console.no-cross-layer-import
      severity: nit
      description: >-
        Client-side files in lib/public/ must not import from server-side
        lib/ modules (CommonJS). Flag any new import that crosses this boundary.
        Nit because CI check-client-imports.js covers resolution; PEACHES catches
        intent before CI runs.
      applies_to:
        - "lib/public/**/*.js"

    # Full decision record (why this option over a CLAUDE.md reminder, a
    # lint-checked annotation, or mutation testing; how the nondeterministic
    # case is handled): docs/guides/TESTING_CONVENTIONS.md.
    #
    # This is a review-judgment rule, not a regex — no `pattern` field.
    # PEACHES's per-chunk model reasoning applies it directly against the
    # diff text, same as any other rulebook item without a mechanical
    # pattern (see AGENT.md's Rulebook section: project overrides are cited
    # by id, not required to be regex-detectable).
    - id: clagentic-console.demonstrated-test-failure
      severity: blocking
      description: >-
        Any new or modified test asserting a bug fix (a "regression test")
        must be traceable to a genuine failure against the pre-fix code, not
        merely accepted on the author's say-so. Do not pass a regression
        test on the strength of a PR/commit claim alone ("verified via git
        stash", "confirmed failing before the fix") — independently trace
        it: identify the parent/pre-fix commit for the changed test and
        confirm, from the diff and commit history available in this review,
        that the assertion the test makes is actually exercised by the code
        path the fix touches (the PR #394 failure mode was a test that
        touched an unrelated directory a readdirSync listing never surfaced
        — plausible-looking, but not connected to the bug at all). You do
        not need to re-run the suite to do this; read the pre-fix version of
        the test/source pair in the diff and confirm the assertion would
        have failed against it.
        Exception — nondeterministic/flaky failures (e.g. lr-b5d62f, a
        load-dependent race that reproduces in only some full-suite runs):
        a test for this class cannot be demonstrated to fail on demand by
        construction. Do not block on demonstrated-failure for these; instead
        require the PR to say explicitly, in the body or a commit message,
        that the failure is load-dependent/nondeterministic and name the
        mechanism (the race/ordering/timing condition), not just assert
        "flaky, trust me". A claim of nondeterminism with no named mechanism
        is itself a finding — it is exactly as unverifiable as an unproven
        determinism claim and must not be used to route around this rule.
      applies_to:
        - "test/**/*.js"
