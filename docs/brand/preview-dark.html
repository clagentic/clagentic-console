<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clagentic: Console - refresh preview, dark</title>
<style>
/* Self-contained: no network, no external fonts or images. DM Sans and DM Mono
   are named first and fall back to the system faces when not installed. */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 "DM Sans",system-ui,sans-serif}
.mono{font-family:"DM Mono",ui-monospace,Menlo,monospace}
main{max-width:1360px;margin:0 auto;padding:24px 20px 96px}
h1{font-size:24px;font-weight:300;letter-spacing:.12em;margin:0 0 4px}
h2{font-size:19px;margin:48px 0 6px;padding-top:14px;border-top:1px solid var(--border)}
h3{font-size:15px;margin:22px 0 6px}
p,li{max-width:96ch}
.note{color:var(--text-muted);font-size:13px;max-width:100ch;margin:4px 0 10px}
code{font-family:"DM Mono",ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--code-bg);padding:1px 5px;border-radius:4px}
table{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0 12px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--border-subtle);vertical-align:top}
th{color:var(--text-muted);font-weight:500}
.sw{display:inline-block;width:30px;height:18px;border-radius:4px;border:1px solid var(--border-strong);vertical-align:middle;margin-right:6px}
.pass{color:var(--success);font-weight:600}
.fail{color:var(--error);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.card{background:var(--bg-alt);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tier{border-radius:8px;padding:10px 12px;font-size:13px;border:1px solid var(--border-strong)}
.cap{font-size:12px;color:var(--text-muted);margin:0 0 4px}
/* frames */
.frame{background:var(--bg);border:1px solid var(--border-strong);border-radius:10px;overflow:hidden;flex:0 0 auto;max-width:100%}
.frame-h{font-size:12px;color:var(--text-muted);padding:6px 10px;background:var(--sidebar-bg);border-bottom:1px solid var(--border)}
.pane{padding:var(--pt) var(--px) var(--pb)}
.av{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;font-weight:700;font-size:12px;color:var(--on-av);line-height:1}
.clamp3{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-clamp:3;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere}
.tool{display:flex;gap:8px;align-items:center;padding:6px 12px;background:var(--bg-alt);border:1px solid var(--border);border-radius:8px;font-size:13px;margin:0 var(--mx) var(--gu)}
.tool b{color:var(--accent);font-weight:500}.tool span{color:var(--text-muted)}
.perm{padding:10px 12px;background:var(--bg-alt);border:1px solid var(--border);border-left:3px solid var(--warning);border-radius:8px;font-size:13px;margin:0 var(--mx) var(--gu)}
.perm .bt{display:flex;gap:8px;margin-top:8px}
.pbtn{border:1px solid var(--border-strong);background:transparent;color:var(--text);border-radius:18px;padding:0 16px;font:inherit;font-size:13px;min-height:var(--pbh)}
.pbtn.go{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.notice{text-align:center;font-size:12px;color:var(--text-muted);margin:0 var(--mx) var(--gu)}
/* today layout */
.t-msg{display:flex;flex-direction:column;padding:0 var(--mx);margin:0 0 var(--gu)}
.t-msg.own{align-items:flex-end}
.t-hd{display:flex;gap:8px;align-items:baseline;font-size:15px;line-height:1.6}
.t-hd b{font-weight:700}.t-hd i{font-style:normal;font-size:12px;color:var(--text-dimmer)}
.t-label{font-size:12px;color:var(--text-dimmer);margin:2px 0 4px;line-height:1.6}
.t-bub{background:var(--user-bubble);border-radius:20px 20px 20px 4px;padding:12px 18px;max-width:85%;font-size:15px;line-height:1.55}
.t-msg.own .t-bub{border-radius:20px 20px 4px 20px}
.t-msg.inj .t-bub{border:1px dashed var(--text-dimmer)}
.t-exp{font-size:12px;line-height:16px;margin-top:2px;color:var(--accent);background:none;border:0;padding:0;font-family:inherit;text-align:left}
.t-act{min-height:28px;padding-top:2px;display:flex;align-items:center;font-size:11px;color:var(--text-dimmer)}
.t-asst{padding:4px var(--mx);margin:0 0 var(--ga);font-size:15px;line-height:1.7}
.t-sq{margin:8px var(--mx);padding:6px 12px;border:1px dashed var(--text-dimmer);border-radius:6px;font-size:13px;color:var(--text-muted);line-height:1.6}
.t-sq .tg{font-size:11px;text-transform:uppercase;color:var(--text-dimmer);margin-right:8px}
.t-sq .tm{font-size:12px;color:var(--accent)}
.t-sq .ac{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.t-sq .ac button{min-height:36px;padding:0 14px;border:1px solid var(--border);border-radius:18px;background:transparent;color:var(--text);font-size:13px;font-family:inherit}
/* proposed layout */
.n-msg{padding:0 var(--mx);margin:0 0 var(--gu)}
.n-hd{display:flex;align-items:center;gap:6px;height:24px;font-size:12px;color:var(--text-dimmer);white-space:nowrap}
.n-hd .nm{font-size:15px;font-weight:700;color:var(--text);line-height:24px}
.n-hd .lb{overflow:hidden;text-overflow:ellipsis;min-width:0}
.n-hd.own{flex-direction:row-reverse}
.tg{position:relative;margin-left:auto;min-width:44px;text-align:center;background:none;border:0;padding:0;font:inherit;font-size:12px;font-weight:500;color:var(--accent);cursor:pointer;white-space:nowrap}
.tg::after{content:"";position:absolute;inset:-10px 0}
.n-hd.own .tg{margin-left:0;margin-right:auto}
.n-bub{padding:8px 12px;border-radius:12px;background:var(--user-bubble);max-width:85%;width:fit-content;font-size:15px;line-height:1.5}
.n-msg.own .n-bub{margin-left:auto}
.n-msg.inj .n-bub{border:1px dashed var(--text-dimmer)}
.n-asst{padding:0 var(--mx);margin:0 0 var(--gu);font-size:15px;line-height:1.6}
.cc{display:flex;align-items:center;gap:8px;margin:0 var(--mx);border:1px dashed var(--text-dimmer);border-radius:8px;padding:4px 8px;font-size:13px}
.cc .meta{font-size:12px;color:var(--accent);white-space:nowrap}
.cc .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-muted)}
.cc .bt{display:flex;gap:6px;flex:0 0 auto}
.cc .b{height:28px;padding:0 10px;border:1px solid var(--border-strong);border-radius:14px;background:transparent;color:var(--text);font:inherit;font-size:13px}
.cc .b svg{display:none}
.phone .cc .b{width:44px;height:44px;padding:0;border:0;border-radius:8px;display:inline-flex;align-items:center;justify-content:center}
.phone .cc .b span{display:none}
.phone .cc .b svg{display:block;width:20px;height:20px}
.phone .cc .bt{gap:0}
.phone .cc .meta .lg{display:none}
.cc.open{flex-wrap:wrap}
.cc.open .meta{flex:1;white-space:normal}
.cc.open .txt{flex:1 1 100%;order:3;white-space:pre-wrap;overflow:visible;color:var(--text-secondary)}
.dim{font-size:12px;color:var(--text-dimmer)}
/* annotation chips */
.chip{display:inline-block;font-size:11px;font-family:"DM Mono",ui-monospace,monospace;border:1px solid var(--border-strong);border-radius:10px;padding:0 7px;color:var(--text-muted)}
.hit{outline:1px dashed var(--accent);outline-offset:-1px}
/* lists and phone flow */
.sl{background:var(--sidebar-bg);border:1px solid var(--border);border-radius:10px;padding:6px;width:280px}
.sl.ph{width:390px}
.sli{display:flex;align-items:center;gap:8px;padding:0 10px;height:30px;border-radius:8px;font-size:13px;font-weight:600;color:var(--text-muted);position:relative}
.sl.ph .sli{height:44px;font-size:15px}
.sli.act{background:var(--sidebar-active);color:var(--text)}
.sli.act::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--accent)}
.sli .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sli .tm{font-size:12px;font-weight:400;color:var(--text-muted)}
.sli .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.sl.today .sli{height:34px}
.scr{width:390px;height:620px;background:var(--bg);border:1px solid var(--border-strong);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.scr .top{display:flex;align-items:center;gap:4px;height:44px;padding:0 4px;background:var(--sidebar-bg);border-bottom:1px solid var(--border);font-weight:600}
.scr .top button,.scr .lrow,.scr .seg button,.tab{min-height:44px}
.scr .bk{width:44px;height:44px;border:0;background:none;color:var(--text);display:flex;align-items:center;justify-content:center}
.scr .bk svg{width:22px;height:22px}
.scr .body{flex:1;overflow:hidden}
.lrow{display:flex;align-items:center;gap:12px;padding:0 16px;font-size:15px;color:var(--text-secondary);border-bottom:1px solid var(--border-subtle);height:44px}
.lrow .v{margin-left:auto;color:var(--text-muted);font-size:13px}
.lrow svg{width:18px;height:18px;color:var(--text-muted)}
.lh{font:500 11px "DM Mono",ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);padding:14px 16px 4px}
.tabs{display:flex;height:56px;background:var(--sidebar-bg);border-top:1px solid var(--border)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--text-muted);position:relative}
.tab.on{color:var(--accent)}
.tap{position:absolute;right:8px;top:2px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on-accent);font:700 12px/22px "DM Sans",sans-serif;text-align:center}
.seg{display:flex;margin:8px 16px;border:1px solid var(--border-strong);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:none;color:var(--text-secondary);font:inherit;font-size:15px}
.seg button.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.sw2{width:44px;height:26px;border-radius:13px;border:1px solid var(--border-strong);background:var(--accent);position:relative;margin-left:auto}
.sw2::after{content:"";position:absolute;right:2px;top:2px;width:20px;height:20px;border-radius:50%;background:var(--on-accent)}
.sheet{position:absolute;left:0;right:0;bottom:56px;background:var(--bg-alt);border-top:1px solid var(--border-strong);border-radius:14px 14px 0 0;padding:8px 0}
</style>
</head>
<body>
<main id="root"><noscript>This preview computes its contrast table and spacing figures in the page. Enable scripting to read them.</noscript></main>
<script>
(function () {
/* ---------- data: proposed dark palette (identical to docs/brand/BRAND.md) ---------- */
var MODE = "dark";
var BASE = {
  base00:"1C2433", base01:"242E40", base02:"364257", base03:"8E9DB3",
  base04:"A7B5C8", base05:"C5D0DE", base06:"EAF0F8", base07:"F5F9FF",
  base08:"FF8094", base09:"00CFFF", base0A:"7BA7F7", base0B:"29D9A8",
  base0C:"A78BFA", base0D:"7BA7F7", base0E:"C084FC", base0F:"818CF8", accent2:"7BA7F7"
};
var TODAY = {

  base08:"FF4D6A", base09:"00CFFF", base0A:"4A7FE8", base0B:"29D9A8",
  base0C:"7B3FE4", base0D:"4A7FE8", base0E:"A855F7", base0F:"6366F1", accent2:"4A7FE8"

  base04:"muted text", base05:"secondary text", base06:"primary text", base07:"strongest text",
  base08:"error", base09:"accent (cyan)", base0A:"blue", base0B:"success",
  base0C:"violet", base0D:"blue (links)", base0E:"keyword purple", base0F:"indigo", accent2:"secondary accent"
};
var TOK = {
  "sidebar-bg":"141B28", "bg":"1C2433", "bg-alt":"242E40", "user-bubble":"2E3A4F", "input-bg":"374359",
  "code-bg":"101722", "sidebar-active":"263245",
  "text":"EAF0F8", "text-secondary":"C5D0DE", "text-muted":"A7B5C8", "text-dimmer":"8E9DB3",
  "border":"364257", "border-subtle":"2A3548", "border-strong":"8294AE",
  "accent":"00CFFF", "accent2":"7BA7F7", "error":"FF8094", "success":"29D9A8", "warning":"F59E0B",
  "on-accent":"0B1220", "on-av":"0B1220",
  "av0":"7FD8F0", "av1":"B9A3F5", "av2":"7FE0C2", "av3":"F2C879"
};
var TOK_ROLE = {
  "sidebar-bg":"sidebar, tier 1 (darkest chrome)", "bg":"page, tier 2", "bg-alt":"raised card, tier 3",
  "user-bubble":"own-message surface, tier 4", "input-bg":"composer input, tier 5", "code-bg":"code blocks",
  "sidebar-active":"selected session row", "text":"primary text", "text-secondary":"body text",
  "text-muted":"labels, secondary UI, placeholders", "text-dimmer":"timestamps, labels on page, sidebar, raised, code",
  "border":"decorative divider", "border-subtle":"hairline", "border-strong":"input, button and control boundary",
  "accent":"interactive, live, focus", "accent2":"links", "error":"failure", "success":"success", "warning":"caution",

  "av0":"avatar tint 1", "av1":"avatar tint 2", "av2":"avatar tint 3", "av3":"avatar tint 4"
};
var SURF = ["sidebar-bg","bg","bg-alt","user-bubble","input-bg","code-bg","sidebar-active"];
var SURF_NAME = {"sidebar-bg":"sidebar","bg":"page","bg-alt":"raised","user-bubble":"own-message","input-bg":"input","code-bg":"code","sidebar-active":"selected row"};
var TEXT_ON = {
  "text":SURF, "text-secondary":SURF, "text-muted":SURF,
  "text-dimmer":["sidebar-bg","bg","bg-alt","code-bg"],
  "accent":["sidebar-bg","bg","bg-alt","user-bubble","code-bg"],
  "accent2":["sidebar-bg","bg","bg-alt","user-bubble","code-bg"],
  "error":["sidebar-bg","bg","bg-alt","user-bubble","code-bg"],
  "success":["sidebar-bg","bg","bg-alt","user-bubble","code-bg"],
  "warning":["sidebar-bg","bg","bg-alt","user-bubble","code-bg"]
};
var TIER_PAIRS = [["sidebar-bg","bg"],["bg","bg-alt"],["bg-alt","user-bubble"],["user-bubble","input-bg"]];
var TODAY_SURF = {"sidebar-bg":"04060B","bg":"060810","bg-alt":"111827","user-bubble":"151F31","input-bg":"172338","code-bg":"05070E"};

/* ---------- spacing constants: the single source for the style vars and the accounting ---------- */
var SP = {
  t: {av:38, name:24, label:25.2, bpy:12, bpx:18, bline:23.25, exp:18, act:30, gu:8, ga:12, ln:20.8, btn:36},
  n: {head:24, bpy:8, bpx:12, bline:22.5, gu:6, grp:2, btn:28, card:38, cardPh:54}
};
var STEPS = [
  {name:"Compact", w:640}, {name:"Comfortable (default)", w:820}, {name:"Wide", w:1040}, {name:"Full", w:1280, full:true}
];

/* ---------- helpers ---------- */
function lin(c){c/=255;return c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4)}
function Y(h){return 0.2126*lin(parseInt(h.substr(0,2),16))+0.7152*lin(parseInt(h.substr(2,2),16))+0.0722*lin(parseInt(h.substr(4,2),16))}
function cr(a,b){var x=Y(a),y=Y(b),hi=Math.max(x,y),lo=Math.min(x,y);return (hi+0.05)/(lo+0.05)}
function Ls(h){var y=Y(h);return y<=216/24389?y*24389/27:116*Math.cbrt(y)-16}
function r1(n){return Math.round(n*10)/10}
function r2(n){return (Math.round(n*100)/100).toFixed(2)}
function T(n){return TOK[n]}
function sw(h){return '<span class="sw" style="background:#'+h+'"></span>'}
function okc(v,min){return v>=min?'<span class="pass">'+r2(v)+':1 pass</span>':'<span class="fail">'+r2(v)+':1 FAIL</span>'}
function av(i,ch,size,rad){return '<span class="av" style="width:'+size+'px;height:'+size+'px;border-radius:'+rad+';background:var(--av'+i+')">'+ch+'</span>'}
var ICON = {
  play:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 4 20 12 6 20 6 4"></polygon></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"></path></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>'
};
function vars(o){var s='';for(var k in o){s+='--'+k+':'+o[k]+';'}return s}

/* ---------- sample content, shared by both layouts ---------- */
var INJ = "Review finished for the scheduler change.\nThe stale-SHA check now runs before the lock read.\nTwo findings remain: the retry cap is not configurable,\nand the timeout message omits the schedule id.\nBoth are filed as follow-ups.";
var SCHED = "Check the build status and report any failing job with its first error line.";

/* ---------- today layout ---------- */
function tMsg(o){
  var s='<div class="t-msg'+(o.own?' own':'')+(o.inj?' inj':'')+'">';
  if(!o.own){
    s+='<div style="margin-top:2px;height:36px">'+av(o.tint,o.init,36,'6px')+'</div>';
    s+='<div class="t-hd"><b>'+o.name+'</b><i>'+o.time+'</i></div>';
    if(o.label) s+='<div class="t-label">'+o.label+'</div>';
  }
  s+='<div class="t-bub">'+(o.clamp?'<span class="clamp3">'+o.text+'</span>':o.text)+'</div>';
  if(o.clamp) s+='<button class="t-exp" type="button">Expand</button>';
  s+='<div class="t-act">'+(o.own?'time on hover, then copy, fork, rewind':'copy, fork, rewind')+'</div></div>';
  return s;
}
function tSched(){
  return '<div class="t-sq"><span class="tg">Scheduled</span><span class="tm">Scheduled repeat - Next at 01:16 PM (8m 18s) - every 20 min - 6 of 9 left</span>'+
    '<div class="clamp3">'+SCHED+' Include the run id and the branch for each failing job. Skip jobs marked flaky.</div>'+
    '<div class="ac"><button type="button">Fire now</button><button type="button">Cancel</button><button type="button">Expand</button></div></div>';
}
function tFrame(w,phone){
  var p=SP.t, mx=20, px=16;
  var st=vars({pt:'20px',px:px+'px',pb:'12px',mx:mx+'px',gu:p.gu+'px',ga:p.ga+'px',pbh:'36px'});
  var s='<div class="frame'+(phone?' phone':'')+'" style="width:'+w+'px;'+st+'"><div class="frame-h">Today, frame '+w+' px</div><div class="pane">';
  s+=tMsg({name:'Dana',init:'D',tint:1,time:'01:05 PM',text:'Can the retry guard read the lock first?'});
  s+=tMsg({own:true,text:'Run the checks again after the reorder.'});
  s+='<div class="t-asst">I found the failing check. The retry guard compares the stale SHA before it reads the lock. Reordering the two reads fixes it.</div>';
  s+=tMsg({name:'review-agent',init:'R',tint:0,time:'01:09 PM',label:'trigger · extracted',inj:true,clamp:true,text:INJ});
  s+='<div class="tool"><b>Read</b><span>lib/daemon.js</span><span>212 lines</span></div>';
  s+='<div class="perm">Bash wants to run: <code>npm test</code><div class="bt"><button class="pbtn go" type="button">Allow</button><button class="pbtn" type="button">Deny</button></div></div>';
  s+='<div class="notice">Context 62% used - session resumed</div>';
  s+=tSched();
  return s+'</div></div>';
}

/* ---------- proposed layout, one header line, mirrored ---------- */
function nHead(o){
  var s='<div class="n-hd'+(o.own?' own':'')+'">';
  if(!o.noav) s+=av(o.tint,o.init,24,'50%');
  if(!o.noname) s+='<span class="nm">'+o.name+'</span>';
  if(o.label) s+='<span class="lb">'+o.label+'</span>';
  s+='<span>'+o.time+'</span>';
  if(o.tg) s+='<button class="tg" type="button">'+o.tg+'</button>';
  return s+'</div>';
}
function nMsg(o){
  return '<div class="n-msg'+(o.own?' own':'')+(o.inj?' inj':'')+'">'+nHead(o)+
    '<div class="n-bub">'+(o.clamp?'<span class="clamp3">'+o.text+'</span>':o.text)+'</div></div>';
}
/* The shared collapsible component, configured by lines, size and controls. */
function ccCard(open,phone){
  var meta=open?'SCHEDULED · Next at 01:16 PM (8m 18s) · every 20 min · 6 of 9 left':'SCHEDULED · <span class="lg">in </span>8m 18s <span class="lg">· every 20 min</span>';
  var full=SCHED+' Include the run id and the branch for each failing job. Skip jobs marked flaky.';
