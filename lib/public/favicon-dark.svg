<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" fill="none">
  <rect width="72" height="72" rx="16" fill="#080A0F"/>
  <defs>
    <linearGradient id="cg" gradientUnits="userSpaceOnUse" x1="6" y1="10" x2="66" y2="62">
      <stop offset="0%"   stop-color="#00CFFF"/>
      <stop offset="50%"  stop-color="#4A7FE8"/>
      <stop offset="100%" stop-color="#7B3FE4"/>
    </linearGradient>
  </defs>
  <!-- Outer frame -->
  <rect x="6" y="10" width="60" height="52" rx="5" ry="5"
        fill="none" stroke="url(#cg)" stroke-width="3.5"/>
  <!-- Vertical divider -->
  <line x1="24" y1="10" x2="24" y2="62"
        stroke="url(#cg)" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Left panel lines -->
  <line x1="10" y1="22" x2="20" y2="22" stroke="url(#cg)" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="10" y1="28" x2="19" y2="28" stroke="url(#cg)" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="10" y1="37" x2="20" y2="37" stroke="url(#cg)" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="10" y1="43" x2="17" y2="43" stroke="url(#cg)" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Bottom-left square -->
  <rect x="10" y="49" width="9" height="7" rx="1.5"
        fill="none" stroke="url(#cg)" stroke-width="1.8"/>
  <!-- Right panel lines -->
  <line x1="29" y1="19" x2="58" y2="19" stroke="url(#cg)" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="29" y1="25" x2="54" y2="25" stroke="url(#cg)" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="29" y1="31" x2="56" y2="31" stroke="url(#cg)" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="29" y1="37" x2="50" y2="37" stroke="url(#cg)" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="29" y1="43" x2="55" y2="43" stroke="url(#cg)" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="29" y1="49" x2="58" y2="49" stroke="url(#cg)" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="29" y1="55" x2="46" y2="55" stroke="url(#cg)" stroke-width="1.8" stroke-linecap="round"/>
</svg>
