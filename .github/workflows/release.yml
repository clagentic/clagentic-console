name: Release

on:
  workflow_dispatch:
    inputs:
      type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - beta
          - release
      beta_ref:
        description: 'Beta version or tag to promote to stable (release type only, e.g. 1.6.0-beta.2 or v1.6.0-beta.2)'
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  beta:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.inputs.type == 'beta'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Ensure release branch exists
        run: |
          git fetch origin
          if ! git rev-parse --verify origin/release >/dev/null 2>&1; then
            echo "release branch missing — creating at main HEAD"
            git push "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/release
          fi
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Sync release tags into main
        run: |
          git config user.name "clagentic-release-bot[bot]"
          git config user.email "clagentic-release-bot[bot]@users.noreply.github.com"
          if git rev-parse --verify origin/release >/dev/null 2>&1; then
            RELEASE_AHEAD=$(git rev-list --count HEAD..origin/release)
            if [ "$RELEASE_AHEAD" -gt 0 ]; then
              echo "Release branch is $RELEASE_AHEAD commits ahead of main, merging..."
              git merge origin/release --no-edit -X theirs || true
              git checkout origin/release -- CHANGELOG.md package.json package-lock.json 2>/dev/null || true
              git diff --quiet || git commit -am "chore: resolve merge conflicts from release"
              git push "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
            fi
          fi
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release (beta)
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_CONFIG_PROVENANCE: true

  promote:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.inputs.type == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Fetch all branches and tags
        run: git fetch --all --tags

      - name: Resolve beta_ref to a tag
        id: resolve-beta
        env:
          BETA_REF: ${{ github.event.inputs.beta_ref }}
        run: |
          if [ -z "$BETA_REF" ]; then
            echo "::error::beta_ref input is required to promote a beta to stable"
            exit 1
          fi
          # Accept either a bare version (1.6.0-beta.2) or a tag (v1.6.0-beta.2).
          case "$BETA_REF" in
            v*) TAG="$BETA_REF" ;;
            *) TAG="v$BETA_REF" ;;
          esac
          if ! git rev-parse --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::tag ${TAG} (resolved from beta_ref='${BETA_REF}') does not exist — cannot promote an untagged beta"
            exit 1
          fi
          BETA_SHA=$(git rev-parse "refs/tags/${TAG}^{commit}")
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${BETA_SHA}" >> "$GITHUB_OUTPUT"
          echo "Resolved beta_ref='${BETA_REF}' -> tag ${TAG} -> commit ${BETA_SHA}"

      - name: Preflight — reject a non-newer beta selection
        run: |
          # Strip the leading v (tag prefix) and the -beta.N (or any -prerelease)
          # suffix to get the base X.Y.Z that semantic-release will actually
          # publish to @latest. Sourced from resolve-beta's own output rather than
          # the raw beta_ref input, so it reflects the actual resolved tag.
          BASE_VERSION=$(echo "$SELECTED_TAG" | sed -E 's/^v//; s/-.*$//')
          if [ -z "$BASE_VERSION" ]; then
            echo "::error::could not resolve a base X.Y.Z version from resolved tag '${SELECTED_TAG}'"
            exit 1
          fi

          CURRENT_LATEST=$(npm view "$NPM_PACKAGE" dist-tags.latest 2>/dev/null || true)

          if [ -z "$CURRENT_LATEST" ]; then
            echo "No published @latest stable found for ${NPM_PACKAGE} — treating as first release, guard passes."
            exit 0
          fi

          # Both sides here are always plain X.Y.Z (stable releases only carry no
          # prerelease suffix), so a numeric major/minor/patch comparison is exact —
          # no external semver tool/dependency needed for this restricted shape.
          IS_NEWER=$(awk -F. -v cur="$CURRENT_LATEST" -v sel="$BASE_VERSION" '
            BEGIN {
              split(cur, c, ".")
              split(sel, s, ".")
              for (i = 1; i <= 3; i++) {
                cn = c[i] + 0
                sn = s[i] + 0
                if (sn > cn) { print "yes"; exit }
                if (sn < cn) { print "no"; exit }
              }
              print "no"
            }
          ')

          if [ "$IS_NEWER" != "yes" ]; then
            echo "::error::selected beta resolves to version ${BASE_VERSION}, which is not strictly newer than the current published stable ${CURRENT_LATEST} (@latest). Select a beta cut after the current stable release."
            exit 1
          fi

          echo "Preflight OK: ${BASE_VERSION} is newer than current stable ${CURRENT_LATEST} — proceeding."
        env:
          SELECTED_TAG: ${{ steps.resolve-beta.outputs.tag }}
          NPM_PACKAGE: ${{ '@clagentic/console' }}

      - name: Ensure release branch exists
        run: |
          if ! git rev-parse --verify origin/release >/dev/null 2>&1; then
            echo "release branch missing — creating at the promoted beta commit"
            git push "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${BETA_SHA}:refs/heads/release"
          fi
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          BETA_SHA: ${{ steps.resolve-beta.outputs.sha }}

      - name: Land the selected beta commit on release
        run: |
          git config user.name "clagentic-release-bot[bot]"
          git config user.email "clagentic-release-bot[bot]@users.noreply.github.com"
          # Stable must be built from the exact tested beta commit, not from a merge with
          # whatever has since landed on main — so release is reset directly onto that commit
          # rather than merged. No conflict-resolution strategy flags or force-checkout hacks
          # are needed: there is nothing to reconcile, the beta commit's tree becomes release's
          # tree outright.
          git checkout -B release "${BETA_SHA}"
          git push "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" release:refs/heads/release
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          BETA_SHA: ${{ steps.resolve-beta.outputs.sha }}

      - name: Trigger stable job on release branch
        run: gh workflow run release.yml --ref release --field type=release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  stable:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release' && github.event.inputs.type == 'release'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release (stable)
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_CONFIG_PROVENANCE: true

      - name: Sync stable version files back to main
        run: |
          git config user.name "clagentic-release-bot[bot]"
          git config user.email "clagentic-release-bot[bot]@users.noreply.github.com"
          git fetch origin main release
          git checkout -B main origin/main
          # Only the version bookkeeping files need to advance on main — take release's copy
          # outright (semantic-release just wrote the authoritative clean X.Y.Z into them on
          # the release branch). This is a deliberate ours-side file copy, not a branch merge,
          # so it cannot produce a merge conflict regardless of what has landed on main since
          # the promoted beta commit.
          git checkout origin/release -- CHANGELOG.md package.json package-lock.json
          git diff --quiet || git commit -am "chore: sync version files from release [skip ci]"
          git push "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
