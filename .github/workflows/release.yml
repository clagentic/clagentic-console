name: Release

on:
  workflow_dispatch:
    inputs:
      type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - beta
          - release
      beta_ref:
        description: 'Beta version or tag to promote to stable (release type only, e.g. 1.6.0-beta.2 or v1.6.0-beta.2). Optional — leave empty to default to the latest promotable beta above the current @latest.'
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  beta:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.inputs.type == 'beta'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Ensure release branch exists
        run: |
          git fetch origin
          if ! git rev-parse --verify origin/release >/dev/null 2>&1; then
            echo "release branch missing — creating at main HEAD"
            git push "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/release
          fi
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Sync release tags into main
        # Tag-reachability only: a beta cut must see any tags/history that landed on
        # release (e.g. a stable cut) so semantic-release's tag-range logic behaves,
        # but it must NEVER adopt release's version bookkeeping files. Those files
        # (package.json version + CHANGELOG boundary) carry the STABLE version,
        # which sits above main's own -beta prerelease line. Force-copying them onto
        # main resets the version basis semantic-release computes from, burying the
        # feature commits that are supposed to drive the next beta below a tag
        # boundary that looks newer — silent no-op (lr-d4413a). The merge below
        # intentionally leaves package.json/CHANGELOG.md/package-lock.json untouched:
        # if the merge itself conflicts on those files, -X theirs already resolves
        # them in release's favor at the git level, which is the wrong direction for
        # a beta — so explicitly keep main's copy of just those three afterward.
        run: |
          git config user.name "clagentic-release-bot[bot]"
          git config user.email "clagentic-release-bot[bot]@users.noreply.github.com"
          if git rev-parse --verify origin/release >/dev/null 2>&1; then
            RELEASE_AHEAD=$(git rev-list --count HEAD..origin/release)
            if [ "$RELEASE_AHEAD" -gt 0 ]; then
              echo "Release branch is $RELEASE_AHEAD commits ahead of main, merging (tag-reachability only, version files stay on main's basis)..."
              PRE_MERGE_HEAD=$(git rev-parse HEAD)
              git merge origin/release --no-edit -X theirs || true
              # Restore main's own version files regardless of how the merge landed —
              # main's -beta version basis must never be replaced by release's stable one.
              git checkout "${PRE_MERGE_HEAD}" -- CHANGELOG.md package.json package-lock.json 2>/dev/null || true
              git diff --quiet || git commit -am "chore: resolve merge conflicts from release (keep main's version basis)"
              git push "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
            fi
          fi
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release (beta)
        id: semantic-release-beta
        run: |
          PRE_RELEASE_HEAD=$(git rev-parse HEAD)
          npx semantic-release
          POST_RELEASE_HEAD=$(git rev-parse HEAD)
          if [ "${PRE_RELEASE_HEAD}" = "${POST_RELEASE_HEAD}" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_CONFIG_PROVENANCE: true

      - name: Fail loud if the dispatched beta published nothing
        # An operator explicitly dispatched type=beta expecting a new prerelease. A
        # green no-op here previously masked the version-basis-clobber bug
        # (lr-d4413a) and left the operator believing the beta had shipped. A
        # dispatched beta with no publishable commits is an error the operator must
        # see, not a silent success — this is a workflow_dispatch-only invariant, not
        # a scheduled/passive run, so failing loud here does not affect any
        # unattended trigger.
        if: steps.semantic-release-beta.outputs.published == 'false'
        run: |
          echo "::error::type=beta was dispatched but semantic-release published nothing — no beta-eligible commits were found above the current version basis. This usually means the sync step above reset main's version basis, or there truly are no releasable commits since the last beta/stable. See lr-d4413a."
          exit 1

      - name: Generate .betas.json (promotable beta list)
        # Non-fatal by design: if generation/commit fails for any reason, the beta
        # publish above has already succeeded and must not be rolled back — the
        # list just goes stale until the next successful beta run. This step never
        # exits non-zero and never touches .github/workflows/** (generated data only).
        run: |
          set +e
          git fetch origin --tags >/dev/null 2>&1

          CURRENT_LATEST=$(npm view "$NPM_PACKAGE" dist-tags.latest 2>/dev/null)

          # Collect all vX.Y.Z-beta.N tags strictly newer than @latest (or all of
          # them, if no stable has published yet), newest first.
          TAGS=$(git tag -l 'v*-beta.*' | awk -F'[v.-]' '{ printf "%05d.%05d.%05d.%05d\t%s\n", $2, $3, $4, $6, $0 }' | sort -r | cut -f2)

          PROMOTABLE=""
          for t in $TAGS; do
            BASE_VERSION=$(echo "$t" | sed -E 's/^v//; s/-.*$//')
            if [ -n "$CURRENT_LATEST" ]; then
              IS_NEWER=$(awk -F. -v cur="$CURRENT_LATEST" -v sel="$BASE_VERSION" '
                BEGIN {
                  split(cur, c, ".")
                  split(sel, s, ".")
                  for (i = 1; i <= 3; i++) {
                    cn = c[i] + 0
                    sn = s[i] + 0
                    if (sn > cn) { print "yes"; exit }
                    if (sn < cn) { print "no"; exit }
                  }
                  print "no"
                }
              ')
              [ "$IS_NEWER" != "yes" ] && continue
            fi
            PROMOTABLE="${PROMOTABLE}${PROMOTABLE:+,}\"${t}\""
          done

          # Guard against writing an empty/garbage file: only proceed once we have
          # at least one entry and valid JSON.
          if [ -z "$PROMOTABLE" ]; then
            echo "No promotable betas found above @latest (${CURRENT_LATEST:-none published}) — skipping .betas.json write."
            exit 0
          fi

          GENERATED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '{\n  "generated_at": "%s",\n  "promotable_betas": [%s]\n}\n' "$GENERATED_AT" "$PROMOTABLE" > .betas.json

          if ! node -e "JSON.parse(require('fs').readFileSync('.betas.json','utf8'))" >/dev/null 2>&1; then
            echo "Generated .betas.json failed JSON validation — discarding, not committing."
            rm -f .betas.json
            exit 0
          fi

          git config user.name "clagentic-release-bot[bot]"
          git config user.email "clagentic-release-bot[bot]@users.noreply.github.com"
          git add .betas.json
          if git diff --cached --quiet; then
            echo ".betas.json unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "chore: update promotable beta list [skip ci]"
          if ! git push "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main; then
            echo "::warning::failed to push .betas.json update — list will be stale until next beta publish (non-fatal, beta publish already succeeded)"
          fi
          exit 0
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_PACKAGE: ${{ '@clagentic/console' }}

  promote:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.inputs.type == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Fetch all branches and tags
        run: git fetch --all --tags

      - name: Resolve beta_ref to a tag
        id: resolve-beta
        env:
          BETA_REF: ${{ github.event.inputs.beta_ref }}
          NPM_PACKAGE: ${{ '@clagentic/console' }}
        run: |
          if [ -z "$BETA_REF" ]; then
            # Default-to-latest: no beta_ref given, so resolve the newest promotable
            # beta tag (highest X.Y.Z-beta.N above the currently published @latest)
            # instead of hard-failing and forcing the operator to hand-type a tag.
            CURRENT_LATEST=$(npm view "$NPM_PACKAGE" dist-tags.latest 2>/dev/null || true)
            echo "beta_ref not provided — defaulting to the latest promotable beta above @latest (${CURRENT_LATEST:-none published yet})."

            # List all vX.Y.Z-beta.N tags, key each by zero-padded numeric fields so a
            # plain lexical sort orders them correctly (avoids a semver dependency),
            # then take the highest.
            TAG=$(git tag -l 'v*-beta.*' | awk -F'[v.-]' '{ printf "%05d.%05d.%05d.%05d\t%s\n", $2, $3, $4, $6, $0 }' | sort -r | head -n1 | cut -f2)

            if [ -z "$TAG" ]; then
              echo "::error::beta_ref was not provided and no v*-beta.* tags exist to default to — cut a beta first"
              exit 1
            fi

            if [ -n "$CURRENT_LATEST" ]; then
              BASE_VERSION=$(echo "$TAG" | sed -E 's/^v//; s/-.*$//')
              IS_NEWER=$(awk -F. -v cur="$CURRENT_LATEST" -v sel="$BASE_VERSION" '
                BEGIN {
                  split(cur, c, ".")
                  split(sel, s, ".")
                  for (i = 1; i <= 3; i++) {
                    cn = c[i] + 0
                    sn = s[i] + 0
                    if (sn > cn) { print "yes"; exit }
                    if (sn < cn) { print "no"; exit }
                  }
                  print "no"
                }
              ')
              if [ "$IS_NEWER" != "yes" ]; then
                echo "::error::highest beta tag ${TAG} resolves to version ${BASE_VERSION}, which is not strictly newer than the current published stable ${CURRENT_LATEST} (@latest) — nothing promotable"
                exit 1
              fi
            fi
          else
            # Accept either a bare version (1.6.0-beta.2) or a tag (v1.6.0-beta.2).
            case "$BETA_REF" in
              v*) TAG="$BETA_REF" ;;
              *) TAG="v$BETA_REF" ;;
            esac
          fi

          if ! git rev-parse --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::tag ${TAG} (resolved from beta_ref='${BETA_REF}') does not exist — cannot promote an untagged beta"
            exit 1
          fi
          BETA_SHA=$(git rev-parse "refs/tags/${TAG}^{commit}")
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${BETA_SHA}" >> "$GITHUB_OUTPUT"
          echo "Resolved beta_ref='${BETA_REF}' -> tag ${TAG} -> commit ${BETA_SHA}"

          # Fat-finger mitigation: the monotonicity preflight only catches an OLDER
          # selection, not a wrong-but-newer tag — so surface the resolved tag/SHA
          # in the run summary as a visible confirm before anything is landed.
          {
            echo "### Promote: resolved beta"
            echo ""
            echo "| beta_ref input | resolved tag | resolved commit |"
            echo "|---|---|---|"
            echo "| \`${BETA_REF:-<empty, defaulted to latest>}\` | \`${TAG}\` | \`${BETA_SHA}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preflight — reject a non-newer beta selection
        run: |
          # Strip the leading v (tag prefix) and the -beta.N (or any -prerelease)
          # suffix to get the base X.Y.Z that semantic-release will actually
          # publish to @latest. Sourced from resolve-beta's own output rather than
          # the raw beta_ref input, so it reflects the actual resolved tag.
          BASE_VERSION=$(echo "$SELECTED_TAG" | sed -E 's/^v//; s/-.*$//')
          if [ -z "$BASE_VERSION" ]; then
            echo "::error::could not resolve a base X.Y.Z version from resolved tag '${SELECTED_TAG}'"
            exit 1
          fi

          CURRENT_LATEST=$(npm view "$NPM_PACKAGE" dist-tags.latest 2>/dev/null || true)

          if [ -z "$CURRENT_LATEST" ]; then
            echo "No published @latest stable found for ${NPM_PACKAGE} — treating as first release, guard passes."
            exit 0
          fi

          # Both sides here are always plain X.Y.Z (stable releases only carry no
          # prerelease suffix), so a numeric major/minor/patch comparison is exact —
          # no external semver tool/dependency needed for this restricted shape.
          IS_NEWER=$(awk -F. -v cur="$CURRENT_LATEST" -v sel="$BASE_VERSION" '
            BEGIN {
              split(cur, c, ".")
              split(sel, s, ".")
              for (i = 1; i <= 3; i++) {
                cn = c[i] + 0
                sn = s[i] + 0
                if (sn > cn) { print "yes"; exit }
                if (sn < cn) { print "no"; exit }
              }
              print "no"
            }
          ')

          if [ "$IS_NEWER" != "yes" ]; then
            echo "::error::selected beta resolves to version ${BASE_VERSION}, which is not strictly newer than the current published stable ${CURRENT_LATEST} (@latest). Select a beta cut after the current stable release."
            exit 1
          fi

          echo "Preflight OK: ${BASE_VERSION} is newer than current stable ${CURRENT_LATEST} — proceeding."
        env:
          SELECTED_TAG: ${{ steps.resolve-beta.outputs.tag }}
          NPM_PACKAGE: ${{ '@clagentic/console' }}

      - name: Ensure release branch exists
        run: |
          if ! git rev-parse --verify origin/release >/dev/null 2>&1; then
            echo "release branch missing — creating at the promoted beta commit"
            git push "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${BETA_SHA}:refs/heads/release"
          fi
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          BETA_SHA: ${{ steps.resolve-beta.outputs.sha }}

      - name: Land the selected beta commit on release
        run: |
          git config user.name "clagentic-release-bot[bot]"
          git config user.email "clagentic-release-bot[bot]@users.noreply.github.com"
          # Stable must be built from the exact tested beta commit, not from a merge with
          # whatever has since landed on main — so release is reset directly onto that commit
          # rather than merged. No conflict-resolution strategy flags or force-checkout hacks
          # are needed: there is nothing to reconcile, the beta commit's tree becomes release's
          # tree outright.
          git checkout -B release "${BETA_SHA}"
          git push "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" release:refs/heads/release
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          BETA_SHA: ${{ steps.resolve-beta.outputs.sha }}

      - name: Trigger stable job on release branch
        run: gh workflow run release.yml --ref release --field type=release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  stable:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release' && github.event.inputs.type == 'release'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Generate Claude model catalog (lr-f22787)
        # Release-time only, never at install/runtime. ANTHROPIC_API_KEY is
        # a repo secret scoped to this workflow step alone — it is never
        # written to a file, never exported beyond this step's env, and is
        # not used for any LLM call (workspace CLAUDE.md rule 17 governs the
        # `claude` CLI invocation path for inference; GET /v1/models is a
        # metadata lookup, not an LLM call). If the secret is absent or the
        # call fails, generate-model-catalog.js exits 0 and leaves the
        # previously committed lib/generated/claude-model-catalog.json
        # untouched — this step is intentionally never allowed to fail the
        # release (see the script's own header comment for the full
        # missing-secret / fetch-failure design).
        run: node scripts/generate-model-catalog.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit regenerated model catalog
        run: |
          git config user.name "clagentic-release-bot[bot]"
          git config user.email "clagentic-release-bot[bot]@users.noreply.github.com"
          git add lib/generated/claude-model-catalog.json
          if git diff --cached --quiet; then
            echo "Model catalog unchanged — nothing to commit."
          else
            git commit -m "chore: regenerate Claude model catalog (lr-f22787) [skip ci]"
          fi

      - name: Run semantic-release (stable)
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_CONFIG_PROVENANCE: true

      - name: Sync stable version files back to main
        run: |
          git config user.name "clagentic-release-bot[bot]"
          git config user.email "clagentic-release-bot[bot]@users.noreply.github.com"
          git fetch origin main release
          git checkout -B main origin/main
          # Only the version bookkeeping files (plus the regenerated model
          # catalog, lr-f22787) need to advance on main — take release's
          # copy outright (semantic-release just wrote the authoritative
          # clean X.Y.Z into them on the release branch, and the catalog
          # step above already regenerated the model list on release). This
          # is a deliberate ours-side file copy, not a branch merge, so it
          # cannot produce a merge conflict regardless of what has landed on
          # main since the promoted beta commit.
          git checkout origin/release -- CHANGELOG.md package.json package-lock.json lib/generated/claude-model-catalog.json
          git diff --quiet || git commit -am "chore: sync version files from release [skip ci]"
          git push "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
