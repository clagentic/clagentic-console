name: Release

on:
  workflow_dispatch:
    inputs:
      type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - beta
          - release

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  beta:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.inputs.type == 'beta'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Ensure release branch exists
        run: |
          git fetch origin
          if ! git rev-parse --verify origin/release >/dev/null 2>&1; then
            echo "release branch missing — creating at main HEAD"
            git push https://x-access-token:${APP_TOKEN}@github.com/${{ github.repository }}.git HEAD:refs/heads/release
          fi
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Sync release tags into main
        run: |
          git config user.name "clagentic-release-bot[bot]"
          git config user.email "clagentic-release-bot[bot]@users.noreply.github.com"
          if git rev-parse --verify origin/release >/dev/null 2>&1; then
            RELEASE_AHEAD=$(git rev-list --count HEAD..origin/release)
            if [ "$RELEASE_AHEAD" -gt 0 ]; then
              echo "Release branch is $RELEASE_AHEAD commits ahead of main, merging..."
              git merge origin/release --no-edit -X theirs || true
              git checkout origin/release -- CHANGELOG.md package.json package-lock.json 2>/dev/null || true
              git diff --quiet || git commit -am "chore: resolve merge conflicts from release"
              git push https://x-access-token:${APP_TOKEN}@github.com/${{ github.repository }}.git main
            fi
          fi
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release (beta)
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_CONFIG_PROVENANCE: true

  promote:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.inputs.type == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Fetch all branches
        run: git fetch --all

      - name: Merge main to release
        run: |
          git config user.name "clagentic-release-bot[bot]"
          git config user.email "clagentic-release-bot[bot]@users.noreply.github.com"
          git checkout -B release origin/release
          git merge main --no-edit -X theirs || true
          git checkout main -- CHANGELOG.md package.json package-lock.json 2>/dev/null || true
          git diff --quiet || git commit -am "chore: resolve merge conflicts from release"
          git push https://x-access-token:${APP_TOKEN}@github.com/${{ github.repository }}.git release
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Trigger stable job on release branch
        run: gh workflow run release.yml --ref release --field type=release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  stable:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release' && github.event.inputs.type == 'release'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release (stable)
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_CONFIG_PROVENANCE: true

      - name: Merge release back to main
        run: |
          git config user.name "clagentic-release-bot[bot]"
          git config user.email "clagentic-release-bot[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          git merge release --no-edit -X theirs || true
          git checkout release -- CHANGELOG.md package.json package-lock.json 2>/dev/null || true
          git diff --quiet || git commit -am "chore: resolve merge conflicts from release"
          git push https://x-access-token:${APP_TOKEN}@github.com/${{ github.repository }}.git main
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
