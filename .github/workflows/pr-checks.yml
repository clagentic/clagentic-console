name: PR Checks

# pull_request_target reads the workflow file from the BASE branch (main),
# so existing PRs that were opened before this workflow existed still get
# checked on reopen / new pushes. The trade-off: pull_request_target normally
# grants secret access to fork code, which is dangerous. This workflow is
# safe under that model because it:
#   - never runs `npm install` (no install-script execution),
#   - never reads secrets,
#   - only runs `node --check` (parse, no execute) and a pure-stdlib reader
#     script (scripts/check-client-imports.js).
# We must still explicitly check out the PR head SHA below — otherwise we'd
# be checking main's code instead of the PR's.
# test-suite runs as its own job on the plain `pull_request` trigger (not
# `_target`) — lr-ae85d5: NAOMI's merge_requirements.tests_pass/ci_pass both
# name pr-checks.yml as the CI gate, but until this job existed, `npm test`
# (which includes esm-import-check.test.js / lr-5e24, boot-smoke-lr-1a5f,
# and app-boot-esm-graph-load-lr-4c58ae) was never actually run by CI — it
# only ran locally, on the honor system, before a PR was opened. `pull_request`
# (unlike `pull_request_target`) checks out the PR head with NO secret access
# and default (read-only) permissions, so it is the standard safe pattern for
# running `npm ci && npm test` against untrusted fork code: GitHub isolates
# this trigger from the base-branch workflow file (a fork PR runs the
# workflow version already on main, not its own edited copy) and grants it
# nothing to exfiltrate. Do NOT merge this job's install/test step into the
# `checks` job above — that job intentionally stays on `pull_request_target`
# with no npm install, exactly per its own header comment.
on:
  pull_request_target:
    branches: [main]
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head (or pushed ref)
        uses: actions/checkout@v4
        with:
          # On pull_request_target, default checkout is the base branch.
          # We want to inspect the PR's actual code, so pin to the head SHA.
          # On push events, github.event.pull_request is null and this
          # falls back to the default ref (the pushed commit).
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Need history so we can fetch and read files from main below.
          fetch-depth: 0

      - name: Restore trusted check tooling from base
        # PRs that predate this workflow don't have scripts/check-client-imports.js
        # at their head — without restoring from main, the run fails on missing
        # file rather than on real import issues. Also defends against a PR
        # replacing the script with a no-op: we always run the version from main.
        if: github.event_name == 'pull_request_target'
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- scripts/check-client-imports.js

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # No npm install — checks only need the standard library.

      - name: Verify client ES module imports resolve
        run: node scripts/check-client-imports.js

      - name: Syntax check server-side JS (CommonJS)
        run: |
          # Server-side .js is CommonJS in this project (no "type" in
          # package.json). `node --check` parses without executing.
          # Excludes lib/public (client ES modules — different parse mode,
          # covered by the import-resolution check above).
          set -e
          fail=0
          while IFS= read -r f; do
            if ! node --check "$f"; then
              echo "Syntax error in: $f" >&2
              fail=1
            fi
          done < <(find bin lib -name '*.js' -not -path 'lib/public/*')
          exit $fail

      - name: Syntax check client-side JS (ES modules)
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            if ! node --check --input-type=module < "$f" >/dev/null 2>&1; then
              # Re-run without redirect to surface the error.
              echo "Syntax error in: $f" >&2
              node --check --input-type=module < "$f" || true
              fail=1
            fi
          done < <(find lib/public -name '*.js')
          exit $fail

  test:
    # lr-ae85d5: separate job, separate (safer) trigger — see the `on:` block
    # comment above for why this must never run under pull_request_target.
    # Skipped on pull_request_target so a fork PR does not attempt this job
    # twice under two different trigger contexts; the plain `pull_request`
    # event already covers it with no secret exposure.
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR head (or pushed ref)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

  test-gate:
    # Fail-closed aggregation. `test` is skipped (not failed) under
    # pull_request_target by design (see its own `if:` comment above) — GitHub
    # does not fail a run because a job was skipped, so a head that produces
    # ONLY a pull_request_target run previously reported the whole workflow
    # SUCCESS with the test suite never executed. This job closes that gap:
    # it runs on every event this workflow listens to, including
    # pull_request_target, and turns "test did not run" into an explicit
    # failure instead of silence.
    #
    # SECURITY: this job MUST stay a pure metadata assertion. No checkout of
    # PR code, no npm install, no execution of anything from the PR — it only
    # reads the `test` job's reported `result`. Adding any of those under
    # pull_request_target would reintroduce the exact secret-exposure risk
    # the `if:` on the `test` job exists to prevent.
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require test job to have actually run and passed
        run: |
          echo "test job result: ${{ needs.test.result }}"
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::test job did not succeed (result: ${{ needs.test.result }}). A skipped or failed test job must not yield a green PR Checks run." >&2
            exit 1
          fi
