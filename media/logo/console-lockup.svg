  <circle cx="83.85" cy="36.50" r="3.2" fill="url(#grad)"/>

  <!-- Colon separator -->
  <circle cx="114" cy="40" r="5" fill="url(#grad)"/>
  <circle cx="114" cy="72" r="5" fill="url(#grad)"/>

  <!-- Console icon, offset to x+132 -->
  <!-- Outer frame -->
  <rect x="142" y="16" width="92" height="80" rx="8" ry="8"
        fill="none" stroke="url(#grad2)" stroke-width="5"/>
  <!-- Vertical divider -->
  <line x1="170" y1="16" x2="170" y2="96"
        stroke="url(#grad2)" stroke-width="3" stroke-opacity="0.6"/>
  <!-- Left panel lines -->
  <line x1="149" y1="34" x2="163" y2="34" stroke="url(#grad2)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="149" y1="42" x2="161" y2="42" stroke="url(#grad2)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="149" y1="54" x2="163" y2="54" stroke="url(#grad2)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="149" y1="62" x2="159" y2="62" stroke="url(#grad2)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Bottom-left square -->
  <rect x="149" y="73" width="14" height="12" rx="2"
