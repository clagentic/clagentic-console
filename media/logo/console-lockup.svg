  <!-- Right panel lines -->
  <line x1="177" y1="30" x2="220" y2="30" stroke="url(#grad2)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="177" y1="39" x2="212" y2="39" stroke="url(#grad2)" stroke-width="2.5" stroke-linecap="round"/>
