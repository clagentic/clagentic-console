  <line x1="177" y1="75" x2="220" y2="75" stroke="url(#grad2)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="177" y1="84" x2="202" y2="84" stroke="url(#grad2)" stroke-width="2.5" stroke-linecap="round"/>

