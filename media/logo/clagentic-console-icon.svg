<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112" width="112" height="112">
  <defs>
    <linearGradient id="grad" gradientUnits="userSpaceOnUse" x1="20" y1="16" x2="92" y2="96">
      <stop offset="0%"   stop-color="#00CFFF"/>
      <stop offset="50%"  stop-color="#4A7FE8"/>
      <stop offset="100%" stop-color="#7B3FE4"/>
    </linearGradient>
  </defs>

  <!-- Terminal window outer frame -->
  <rect x="10" y="16" width="92" height="80" rx="8" ry="8"
        fill="none" stroke="url(#grad)" stroke-width="5"/>

  <!-- Vertical divider ~30% from left -->
  <line x1="38" y1="16" x2="38" y2="96"
        stroke="url(#grad)" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Left panel: short horizontal lines (sidebar items) -->
  <line x1="17" y1="34" x2="31" y2="34" stroke="url(#grad)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="17" y1="42" x2="29" y2="42" stroke="url(#grad)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="17" y1="54" x2="31" y2="54" stroke="url(#grad)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="17" y1="62" x2="27" y2="62" stroke="url(#grad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Bottom-left square (status/button) -->
  <rect x="17" y="73" width="14" height="12" rx="2"
        fill="none" stroke="url(#grad)" stroke-width="2.5"/>

  <!-- Right panel: horizontal lines (code/output) -->
  <line x1="45" y1="30" x2="88" y2="30" stroke="url(#grad)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="45" y1="39" x2="80" y2="39" stroke="url(#grad)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="45" y1="48" x2="85" y2="48" stroke="url(#grad)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="45" y1="57" x2="74" y2="57" stroke="url(#grad)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="45" y1="66" x2="82" y2="66" stroke="url(#grad)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="45" y1="75" x2="88" y2="75" stroke="url(#grad)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="45" y1="84" x2="70" y2="84" stroke="url(#grad)" stroke-width="2.5" stroke-linecap="round"/>

</svg>
